name: Sync site settings

on:
  push:
    paths:
      - '_data/site.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync public settings
        run: cp _data/site.json content/site.json
      - name: Commit synced settings
        run: |
          if git diff --quiet -- content/site.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/site.json
          git commit -m "Sync public site settings"
          git push
