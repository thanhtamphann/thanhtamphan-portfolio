  - name: motion
    label: 03. Hiệu ứng chuyển động
    type: file
    path: content/motion.json
    format: json
    fields:
      - { name: enabled, label: Bật hiệu ứng, type: boolean }
      - name: intensity
        label: Mức độ hiệu ứng
        type: select
        options: { values: [subtle, medium, strong] }
      - { name: heroText, label: Hiệu ứng chữ ở trang đầu, type: boolean }
      - { name: scrollReveal, label: Hiệu ứng khi cuộn trang, type: boolean }
      - { name: hoverEffects, label: Hiệu ứng khi rê chuột, type: boolean }
      - { name: statAnimation, label: Hiệu ứng số liệu, type: boolean }




  - name: cases
    label: 04. Case Studies — thêm, xóa & sắp xếp
    type: file
    path: content/cases.json
    format: json
    fields:
      - name: items
        label: Danh sách Case Studies
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{labelEn} ({index})"
        fields:
          - { name: enabled, label: Hiển thị, type: boolean, default: true }
          - { name: order, label: Thứ tự, type: number }
          - { name: labelEn, label: Nhãn — English, type: string, required: true }
          - { name: labelVi, label: Nhãn — Tiếng Việt, type: string, required: true }
          - { name: titleEn, label: Tiêu đề — English, type: text, required: true }
          - { name: titleVi, label: Tiêu đề — Tiếng Việt, type: text, required: true }
          - { name: bodyEn, label: Nội dung — English, type: text, required: true }
          - { name: bodyVi, label: Nội dung — Tiếng Việt, type: text, required: true }




  - name: blog
    label: 05. Blog — thêm, sửa và xóa bài
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{title}.md"
    format: yaml-frontmatter
    view:
      fields: [title, category, featured, published]
      primary: title
      search: [title, category, excerpt, tags]
    fields:
      - { name: layout, label: false, type: string, hidden: true, default: post }
      - { name: title, label: Tiêu đề bài viết, type: string, required: true }
      - { name: published, label: Đã xuất bản, type: boolean, default: true }
      - { name: featured, label: Bài nổi bật, type: boolean, default: false }
      - name: category
        label: Chủ đề
        type: string
        required: true
        description: Gõ chủ đề mới tùy ý. Website tự tạo bộ lọc mới từ chủ đề này.
      - { name: tags, label: Tags, type: string, list: true }
      - name: accent
        label: Màu bài viết
        type: select
        default: coral
        options:
          values:
            - { name: coral, label: Coral / Cam }
            - { name: blue, label: Blue / Xanh }
            - { name: acid, label: Acid / Xanh neon }
            - { name: lavender, label: Lavender / Tím nhạt }
            - { name: pink, label: Pink / Hồng }
            - { name: mint, label: Mint / Xanh mint }
            - { name: sand, label: Sand / Be }
            - { name: ink, label: Ink / Đen }
