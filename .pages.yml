media:
  - name: portfolio_images
    label: Ảnh portfolio
    input: assets/images
    output: /thanhtamphan-portfolio/assets/images
    extensions: [jpg, jpeg, png, webp, gif]
    categories: [image]
    rename: safe

content:
  - name: portfolio
    label: Video, số liệu & liên hệ
    type: file
    path: content/portfolio.json
    format: json
    fields:
      - name: stats
        label: Các con số nổi bật
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{value} — {en}"
        fields:
          - name: value
            label: Con số
            type: string
            required: true
          - name: en
            label: Chú thích tiếng Anh
            type: string
            required: true
          - name: vi
            label: Chú thích tiếng Việt
            type: string
            required: true

      - name: projects
        label: Video tiêu biểu — có thể thêm, xóa và sắp xếp
        type: object
        description: Dùng nút thêm mục để tạo video mới. Kéo thả để đổi thứ tự hiển thị.
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: category
            label: Chủ đề / bộ lọc
            type: string
            required: true
          - name: videoUrl
            label: Link video YouTube
            type: string
            description: Chỉ cần dán toàn bộ đường dẫn YouTube. Website sẽ tự lấy thumbnail.
          - name: videoId
            label: YouTube Video ID (dự phòng)
            type: string
            description: Video cũ đang dùng ID. Khi thêm video mới, bạn có thể chỉ điền Link video YouTube ở trên.
          - name: image
            label: Ảnh tùy chỉnh (không bắt buộc)
            type: image
            description: Để trống để website tự dùng thumbnail YouTube.
            options:
              media: portfolio_images
              extensions: [jpg, jpeg, png, webp, gif]
              rename: safe
          - name: title
            label: Tiêu đề video
            type: string
            required: true
          - name: views
            label: Lượt xem công khai
            type: string
            required: true
          - name: likes
            label: Lượt thích công khai (không bắt buộc)
            type: string
            description: Ví dụ 26.7K. Nếu có số này, website sẽ ưu tiên hiển thị Likes.
          - name: averageViews
            label: View trung bình ước tính
            type: string
            description: Không bắt buộc. View trung bình của các video tiêu biểu trong cùng nhóm nội dung.
          - name: en
            label: Mô tả tiếng Anh
            type: text
            required: true
          - name: vi
            label: Mô tả tiếng Việt
            type: text
            required: true

      - name: profile
        label: Ảnh cá nhân
        type: object
        fields:
          - name: image
            label: Tải ảnh chân dung
            type: image
            description: Có thể để trống và tải ảnh của bạn lên sau. Ảnh dọc tỷ lệ 4:5 sẽ đẹp nhất.
            options:
              media: portfolio_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: alt
            label: Mô tả ảnh
            type: string
            description: Dùng cho khả năng truy cập và công cụ tìm kiếm.

      - name: expertise
        label: Kỹ năng
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{fields.title.en}"
        fields:
          - name: title
            label: Tiêu đề
            type: object
            fields:
              - { name: en, label: Tiếng Anh, type: string, required: true }
              - { name: vi, label: Tiếng Việt, type: string, required: true }
          - name: body
            label: Nội dung
            type: object
            fields:
              - { name: en, label: Tiếng Anh, type: text, required: true }
              - { name: vi, label: Tiếng Việt, type: text, required: true }

      - name: process
        label: Quy trình làm việc
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{fields.title.en}"
        fields:
          - name: title
            label: Tên bước
            type: object
            fields:
              - { name: en, label: Tiếng Anh, type: string, required: true }
              - { name: vi, label: Tiếng Việt, type: string, required: true }
          - name: body
            label: Mô tả bước
            type: object
            fields:
              - { name: en, label: Tiếng Anh, type: text, required: true }
              - { name: vi, label: Tiếng Việt, type: text, required: true }

      - name: tags
        label: Thẻ chuyên môn
        type: string
        list: true

      - name: contact
        label: Thông tin liên hệ
        type: object
        fields:
          - name: github
            label: Link GitHub
            type: string
          - name: email
            label: Email
            type: string
          - name: linkedin
            label: Link LinkedIn
            type: string

